services:
  app:
    container_name: spmi-management
    build:
      context: .
      dockerfile: Dockerfile
    image: espmi-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-9000}:9000"
    volumes:
      - app-storage:/var/www/html/storage
      - ${APP_ENV_FILE:-.env}:/var/www/html/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 5

  queue:
    image: espmi-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - app-storage:/var/www/html/storage
      - ${APP_ENV_FILE:-.env}:/var/www/html/.env:ro
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90"]

  scheduler:
    image: espmi-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - app-storage:/var/www/html/storage
      - ${APP_ENV_FILE:-.env}:/var/www/html/.env:ro
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]

volumes:
  app-storage:
